# Tests, lint and type checks for this repository. Agents under test are not run here:
# the tests use the built-in control agents and a scripted agent.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        # Lint and type checker versions are pinned so a new release cannot turn the build red on its own.
        run: python -m pip install -e ".[dev,inspect]" "ruff==0.17.4" "mypy==2.4.1"
      - name: Tests
        # The importer regeneration tests read the fixtures under tests/fixtures and run by default.
        run: python -m pytest -q
      - name: Lint
        run: ruff check atr_eval tests scripts
      - name: Types
        run: mypy atr_eval --ignore-missing-imports
      - name: Shared results table is current
        # The pooled table is rebuilt from results/shared/*.json; a pull request that adds a share must rebuild it too.
        run: |
          atr-eval dataset build results/shared --out results/dataset.json > results/TABLE.md
          git diff --exit-code -- results/
